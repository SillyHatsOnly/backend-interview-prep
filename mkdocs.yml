      - M4b · Socket → TCP → HTTP: modules/m4b-network-concurrency/01_socket_tcp_http.md
      - M4b · Threads и GIL: modules/m4b-network-concurrency/02_threads_gil.md
      - M4b · Модель asyncio: modules/m4b-network-concurrency/03_asyncio_model.md
