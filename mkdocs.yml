      - M4b · Мини-практика: modules/m4b-network-concurrency/05_mini_practice.md
      - M4b · Домашка: modules/m4b-network-concurrency/homework.md
  - Моки:
      - Обзор: mocks/index.md
  - Справочник:
      - Канон источников: reference/sources-canon.md
      - Карта чтения: reference/reading-map.md
      - Книги: reference/books.md
      - System design: reference/system-design.md
      - SD-карточки: reference/sd-cards/index.md
      - SD-01 URL shortener: reference/sd-cards/01_url_shortener.md
      - SD-02 Очередь уведомлений: reference/sd-cards/02_notification_queue.md
      - Эталоны (после ревью): solutions/README.md
      - Эталон M0: solutions/m0.md
      - Yakimka checklist: reference/yakimka.md
      - Git аварийный: reference/git-accidents.md
