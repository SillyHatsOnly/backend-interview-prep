site_name: Backend Interview Prep
site_description: Подготовка к middle Python backend и система ремесла — ядро ~9–12 месяцев + фаза 2
site_url: https://sillyhatsonly.github.io/backend-interview-prep/
repo_url: https://github.com/SillyHatsOnly/backend-interview-prep
repo_name: SillyHatsOnly/backend-interview-prep

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Главная: index.md
  - План:
      - Ядро ~год + фаза 2: plan/PLAN_6M.md
      - Как учиться: plan/how-to-study.md
      - Capstone Harbor: plan/capstone-harbor.md
  - Канон:
      - Документация курса: canon/DOC_GENERATION.md
      - Стиль прозы: canon/writing_style.md
  - Модули:
      - Обзор модулей: modules/index.md
      - M0 · Старт: modules/m0-start/index.md
      - M0.5 · Как решать задачу: modules/m0b-thinking/index.md
      - M0.5 · Цикл: modules/m0b-thinking/01_cycle.md
      - M0.5 · Чеклист: modules/m0b-thinking/checklist.md
      - M0.5 · Домашка: modules/m0b-thinking/homework.md
      - M1 · Python foundation: modules/m1-python/index.md
      - M1 · Dataclass: modules/m1-python/01_dataclasses.md
      - M1 · Методы и декораторы: modules/m1-python/02_methods_decorators.md
      - M1 · Typing: modules/m1-python/03_typing.md
      - M1 · Домашка: modules/m1-python/homework.md
      - M1b · Python глубже: modules/m1b-python-deeper/index.md
      - M1b · Исключения: modules/m1b-python-deeper/01_exceptions.md
      - M1b · Итераторы и генераторы: modules/m1b-python-deeper/02_iterators_generators.md
      - M1b · Args и включения: modules/m1b-python-deeper/03_args_comprehensions.md
      - M1b · Копии и мутация: modules/m1b-python-deeper/04_copy_mutability.md
      - M1b · Пакеты: modules/m1b-python-deeper/05_packages.md
      - M1b · Pyright: modules/m1b-python-deeper/06_pyright.md
      - M1b · Чтение кода: modules/m1b-python-deeper/07_reading_code.md
      - M1b · Домашка: modules/m1b-python-deeper/homework.md
      - M2 · Алгоритмы I: modules/m2-algo-i/index.md
      - M2 · Сложность: modules/m2-algo-i/01_complexity.md
      - M2 · Массив и хеш: modules/m2-algo-i/02_hash.md
      - M2 · Указатели и окно: modules/m2-algo-i/03_pointers_window.md
      - M2 · Стек: modules/m2-algo-i/04_stack.md
      - M2 · Бинарный поиск: modules/m2-algo-i/05_binary_search.md
      - M2 · Домашка: modules/m2-algo-i/homework.md
      - M3 · Алгоритмы II: modules/m3-algo-ii/index.md
      - M3 · Граф площадки: modules/m3-algo-ii/01_graphs.md
      - M3 · BFS и DFS: modules/m3-algo-ii/02_bfs_dfs.md
      - M3 · Перебор с откатом: modules/m3-algo-ii/03_backtracking.md
      - M3 · Куча: modules/m3-algo-ii/04_heap.md
      - M3 · Домашка: modules/m3-algo-ii/homework.md
      - M4a · Машина / ОС: modules/m4a-os/index.md
      - M4a · Процесс: modules/m4a-os/01_process.md
      - M4a · Память: modules/m4a-os/02_memory.md
      - M4a · Файлы и FD: modules/m4a-os/03_files_fd.md
      - M4a · Планировщик и blocking: modules/m4a-os/04_scheduling_blocking.md
      - M4a · Linux lab: modules/m4a-os/05_linux_lab.md
